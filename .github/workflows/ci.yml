name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/fj_solutions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm build:contracts

      - name: Validate Prisma schema
        run: pnpm --filter fj-solutions-backend exec prisma validate --schema=../../database/schema.prisma

      - name: Generate Prisma client
        run: pnpm --filter fj-solutions-backend exec prisma generate --schema=../../database/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

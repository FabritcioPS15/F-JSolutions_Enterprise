version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fj-solutions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fj_solutions
      POSTGRES_PASSWORD: fj_solutions_password
      POSTGRES_DB: fj_solutions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fj-solutions-network

  # Redis Cache (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: fj-solutions-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fj-solutions-network

  # API Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fj-solutions-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fj_solutions:fj_solutions_password@postgres:5432/fj_solutions
      PORT: 4000
      API_PREFIX: /api/v1
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en el archivo .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en el archivo .env}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      EMAIL_FROM: "${EMAIL_FROM:-F&J Systems <no-reply@fjsolutions.pe>}"
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-5}"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - fj-solutions-network
    volumes:
      - ./apps/api/uploads:/app/uploads

  # Web Frontend (Tienda pública)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fj-solutions-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_STORE_URL: "${NEXT_PUBLIC_STORE_URL:-http://localhost:3000}"
      HELPDESK_API_URL: http://api:4000/api/v1
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - fj-solutions-network

  # Admin Panel (Panel de administración)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: fj-solutions-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_STORE_URL: "${NEXT_PUBLIC_STORE_URL:-http://localhost:3000}"
      HELPDESK_API_URL: http://api:4000/api/v1
      API_INTERNAL_URL: http://api:4000/api/v1
    ports:
      - "3002:3000"
    depends_on:
      - api
    networks:
      - fj-solutions-network

volumes:
  postgres_data:
  redis_data:

networks:
  fj-solutions-network:
    driver: bridge

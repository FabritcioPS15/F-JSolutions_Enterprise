pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

ignoreWorkspaceRootCheck: true

packages:
  - 'apps/*'
  - 'packages/*'

packageExtensions:
  next@16.4.5:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: false
  esbuild: true
  prisma: true
